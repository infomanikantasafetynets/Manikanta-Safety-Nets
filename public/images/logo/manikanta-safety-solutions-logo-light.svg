<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="500" height="100" fill="none">
  <defs>
    <linearGradient id="mssTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0D5C5C" />
      <stop offset="100%" stopColor="#093E3E" />
    </linearGradient>
    <linearGradient id="mssAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5B054" />
      <stop offset="100%" stopColor="#E8972F" />
    </linearGradient>
  </defs>

  <!-- Monogram Shield 'M' Badge -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="20" fill="url(#mssTealGrad)" />
    <!-- Outer Shield Border Accent -->
    <rect x="3" y="3" width="74" height="74" rx="17" stroke="url(#mssAmberGrad)" stroke-width="2.5" fill="none" opacity="0.9" />
    <!-- Stylized 'M' Monogram with Architectural Safety Mesh Geometry -->
    <path d="M 22 62 L 22 26 L 40 46 L 58 26 L 58 62 M 31 48 L 49 48" 
          stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="40" cy="22" r="3.5" fill="url(#mssAmberGrad)" />
  </g>

  <!-- Typography: Manikanta Safety Solutions -->
  <text x="106" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#0D5C5C" letter-spacing="-0.5">
    MANIKANTA
  </text>
  <text x="272" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#E8972F" letter-spacing="-0.5">
    SAFETY
  </text>
  <text x="108" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4A4A4A" letter-spacing="3.5">
    SOLUTIONS BANGALORE
  </text>
</svg>
