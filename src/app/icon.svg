<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mFavTealApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0D5C5C" />
      <stop offset="100%" stopColor="#093E3E" />
    </linearGradient>
    <linearGradient id="mFavAmberApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5B054" />
      <stop offset="100%" stopColor="#E8972F" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Teal Shield -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#mFavTealApp)" stroke="url(#mFavAmberApp)" stroke-width="3.5" />

  <!-- Clean 'M' Monogram with Interlocking Geometry -->
  <path d="M 27 72 L 27 28 L 50 52 L 73 28 L 73 72" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Amber Tension Point Dot -->
  <circle cx="50" cy="24" r="4.5" fill="url(#mFavAmberApp)" />
</svg>